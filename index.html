<script>

const names=['待初审','待复审','已入账','已退回'],tones=['#0879ff','#6654f7','#12a36a','#ef2f4f'],classes=['blue','purple','green','red'];
const units=['鞍钢集团矿业有限公司齐大山分公司','鞍钢集团矿业弓长岭有限公司井采分公司','鞍钢矿山机械制造有限公司'];
const descriptions=['磨碎作业区2号磨机东侧平台防护栏松动','140米水平230巷1号掘进作业面照明不足','125水平10穿采场废铁未及时清走','钢球作业区80烧车床废弃卷筒未清理','钢球作业区平台沿边缺安全护栏','50米水平10穿采场顶板存在浮石','主井304液压站油位已到下限需补充液压油','运输巷道电缆敷设不规范','破碎车间消防通道被物料占用','检修平台安全警示标识缺失','配电箱接地线连接松动','设备传动部位防护罩破损'];
const seed=()=>descriptions.map((desc,i)=>({id:'YH-20261013-'+String(i+1).padStart(3,'0'),unit:units[i%3],desc,level:i===5?'重大隐患':'一般隐患',rectify:['待整改','整改中','已整改'][i%3],reporter:['王天龙','李有君','乔霖'][i%3],time:'2026-10-'+(i%2?'12':'13')+' '+String(8+i%8).padStart(2,'0')+':'+(i%2?'35':'20'),status:i<6?0:i<9?1:i<11?2:3,first:i>=6?'张广利':'',history:i<6?[]:i<9?[{who:'张广利',action:'初审通过',time:'2026-10-13 10:25',note:'已核对上报单位、隐患描述及整改情况，资料完整。'}]:i<11?[{who:'张广利',action:'初审通过',time:'2026-10-13 09:20',note:'隐患信息核对无误。'},{who:'王志磊',action:'复审通过，正式入账',time:'2026-10-13 11:10',note:'核准通过。'}]:[{who:'张广利',action:'初审退回',time:'2026-10-13 09:40',note:'请补充防护罩破损位置及整改责任人。'}]}));
let data;try{data=JSON.parse(localStorage.getItem('hazard-review-v1'))||seed();if(!Array.isArray(data)||!data.length)data=seed()}catch{data=seed()}let current=0,person='张广利',unit='',rectify='',keyword='',source='',datasetMode='period',dateStart='2026-10-13',dateEnd='2026-10-13',page=1,selected=null,lastFocus;const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function sourceFor(d){if(d.source==='同步公司隐患'||d.source==='手动新增')return d.source;let n=parseInt(d.id.slice(-3),10)||0;return n%2?'同步公司隐患':'手动新增'}
function baseMatched(d,includeTime=true){let day=d.time.slice(0,10);return(!unit||d.unit===unit)&&(!source||sourceFor(d)===source)&&(!rectify||d.rectify===rectify)&&(!keyword||[d.desc,d.id,d.reporter].some(v=>v.includes(keyword)))&&(!includeTime||(day>=dateStart&&day<=dateEnd))}
function updateOverview(){let period=data.filter(d=>baseMatched(d,true)),reportedUnits=new Set(period.map(d=>d.unit)).size,self=period.filter(d=>sourceFor(d)==='手动新增').length,rectified=period.filter(d=>d.rectify==='已整改').length,newStock=data.filter(d=>baseMatched(d,false)&&d.time.slice(0,10)<dateStart&&d.rectify!=='已整改').length,totalStock=data.filter(d=>(!unit||d.unit===unit)&&(!source||sourceFor(d)===source)&&d.rectify!=='已整改').length;$('dataOverview').innerHTML=`当前周期上报隐患单位数 <b>${reportedUnits}</b> 家，手动新增隐患共计 <b>${self}</b> 条，已整改 <b>${rectified}</b> 条，新增存量隐患 <b>${newStock}</b> 条，累计存量未整改隐患 <b>${totalStock}</b> 条`}
function filtered(){let result=data.filter(d=>d.status===current&&baseMatched(d,datasetMode==='period')&&(datasetMode==='period'||d.rectify!=='已整改'));updateOverview();return result}
function render(){let counts=names.map((_,i)=>data.filter(d=>d.status===i).length);$('stats').innerHTML=names.map((n,i)=>`<button class="stat ${current===i?'active':''}" style="--tone:${tones[i]}" onclick="changeTab(${i})"><span class="icon"><svg viewBox="0 0 24 24"><path d="M7 4h10v3H7zM7 5H4v16h16V5h-3M8 12h8M8 16h5"/></svg></span><div>${n}<div class="num">${counts[i]}<small>条</small></div></div></button>`).join('');$('tabs').innerHTML=names.map((n,i)=>`<button class="tab ${current===i?'active':''}" onclick="changeTab(${i})">${n}（${counts[i]}）</button>`).join('');let list=filtered(),max=Math.max(1,Math.ceil(list.length/6));page=Math.min(page,max);$('summary').textContent='共 '+list.length+' 条';$('rows').innerHTML=list.slice((page-1)*6,page*6).map((d,i)=>`<tr><td>${(page-1)*6+i+1}</td><td>${esc(d.unit)}</td><td><div class="desc" title="${esc(d.desc)}">${esc(d.desc)}</div><span class="muted">${d.id}</span></td><td><span class="${d.level==='重大隐患'?'red pill':''}">${d.level}</span></td><td><span class="pill ${d.rectify==='已整改'?'green':d.rectify==='待整改'?'orange':'blue'}">${d.rectify}</span></td><td>${d.reporter}</td><td>${d.time}</td><td><span class="pill ${classes[d.status]}">${names[d.status]}</span></td><td>${d.first||'—'}</td><td><div class="actions"><button class="rowbtn" onclick="openRecord('${d.id}',false)">查看</button>${d.status<2?`<button class="rowbtn" onclick="openRecord('${d.id}',true)">${d.status===0?'初审':'复审'}</button>`:''}</div></td></tr>`).join('');$('empty').hidden=!!list.length;$('pagination').innerHTML=`<span class="muted">共 ${list.length} 条　6 条 / 页</span><button class="pagenum" ${page===1?'disabled':''} onclick="goPage(-1)" aria-label="上一页">‹</button>`+Array.from({length:max},(_,i)=>`<button class="pagenum ${page===i+1?'active':''}" onclick="page=${i+1};render()">${i+1}</button>`).join('')+`<button class="pagenum" ${page===max?'disabled':''} onclick="goPage(1)" aria-label="下一页">›</button>`}
function changeTab(i){current=i;page=1;render()}function goPage(n){page+=n;render()}
